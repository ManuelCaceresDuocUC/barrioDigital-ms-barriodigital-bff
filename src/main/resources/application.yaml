# Configuración del BFF (puerta única hacia los microservicios).
server:
  port: 8080

# URL base de cada microservicio. Dentro de Docker se resuelven por el nombre del contenedor;
# la variable de entorno tiene prioridad (valor tras los dos puntos = por defecto).
services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://ms-barriodigital-catalog:8082}
  requests:
    url: ${REQUESTS_SERVICE_URL:http://ms-barriodigital-requests:8081}
  report:
    url: ${REPORT_SERVICE_URL:http://ms-barriodigital-report:8084}
  audit:
    url: ${AUDIT_SERVICE_URL:http://ms-barriodigital-audit:8085}
  rabbit:
    url: ${RABBITADMIN_SERVICE_URL:http://ms-barriodigital-rabbitadmin:8086}
  kafka:
    url: ${KAFKAADMIN_SERVICE_URL:http://ms-barriodigital-kafkaadmin:8087}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor de los tokens: el tenant de Microsoft Entra ID. Spring descubre de aquí las claves
          # públicas con las que verifica la firma de cada JWT.
          issuer-uri: https://login.microsoftonline.com/ffcb40ec-aa43-4c4e-acd8-4d27467872c5/v2.0
